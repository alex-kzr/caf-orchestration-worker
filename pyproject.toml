[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caf-orchestration-worker"
version = "0.1.0"
description = "CAF provider-neutral orchestration experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["caf-agent-runtime==0.1.0", "caf-control-api==0.1.0"]

[project.optional-dependencies]
flow = [
    "crewai==1.15.27",
]

[tool.uv.sources]
caf-agent-runtime = { git = "https://github.com/alex-kzr/caf-agent-runtime", rev = "1aac05c60db738dd51f95644490fba11e6e6c269" }
caf-control-api = { git = "https://github.com/alex-kzr/caf-control-api", rev = "e46c34d8a49affcaab6f61c27178f99c4661345d" }

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
