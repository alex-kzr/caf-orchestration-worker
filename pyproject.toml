[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caf-orchestration-worker"
version = "0.1.0"
description = "CAF provider-neutral orchestration experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["caf-agent-runtime==0.1.0", "caf-control-api==0.1.0"]

[project.optional-dependencies]
flow = [
    "crewai==1.15.27",
]

[tool.uv.sources]
caf-agent-runtime = { git = "https://github.com/alex-kzr/caf-agent-runtime", rev = "1fbef1d5f2325d124c39fac256b11aa722a7c2e8" }
caf-control-api = { git = "https://github.com/alex-kzr/caf-control-api", rev = "3dc0fa331bf5b122b45f646f101a7ddce9631657" }

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
