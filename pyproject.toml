[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caf-orchestration-worker"
version = "0.1.0"
description = "CAF provider-neutral orchestration experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["caf-agent-runtime==0.1.0"]

[project.optional-dependencies]
flow = [
    "crewai==1.15.27",
]

[tool.uv.sources]
caf-agent-runtime = { git = "https://github.com/alex-kzr/caf-agent-runtime", rev = "227e0cc0166fcf3c9bbdc8894ba483065a49836f" }

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
